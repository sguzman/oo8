# Insert this [packages.oo8] stanza in ~/.config/soar/packages.toml once.
# Soar checks sguzman/oo8 GitHub Releases when running 'soar update'.
# This is a fragment, not a replacement for your existing Soar config.

[packages.oo8]
github = "sguzman/oo8"
asset_pattern = "oo8-x86_64-linux.tar.gz"
pkg_type = "archive"
entrypoint = "oo8-daemon"
binaries = [
  { source = "bin/oo8-daemon", link_as = "oo8-daemon" },
  { source = "bin/oo8-daemon-login", link_as = "oo8-daemon-login" },
  { source = "bin/oo8-portal", link_as = "oo8-portal" },
  { source = "bin/oo8-cli", link_as = "oo8-cli" },
  { source = "bin/git-credential-oo8", link_as = "git-credential-oo8" },
  { source = "bin/cargo-credential-oo8", link_as = "cargo-credential-oo8" },
]
