name: oo8 isolated startup regression

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# New pushes supersede pending staging runs for the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  startup-race:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install private D-Bus test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus dbus-bin
      - name: Build oo7-compatible daemon and CLI from oo8
        run: cargo build --locked -p oo7-daemon -p oo7-cli
      - name: Exercise startup and systemd credential import in isolation
        env:
          OO8_STARTUP_ITERATIONS: "12"
        run: timeout 120s bash tests/oo8-startup-race.sh
      - name: Exercise persistent keyrings, incorrect credentials and recovery
        run: timeout 120s bash tests/oo8-keyring-lifecycle.sh
      - name: Exercise real systemd user service and LoadCredential
        run: |
          sudo timeout 120s bash tests/oo8-systemd-user.sh \
            "$PWD/target/debug/oo7-daemon" "$PWD/target/debug/oo7-cli"
