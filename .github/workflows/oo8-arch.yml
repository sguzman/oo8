name: oo8 Arch package

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  # Required only to attach binaries to a GitHub Release for a version tag.
  contents: write

# New pushes supersede pending staging runs for the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7
      - name: Prepare Arch build environment
        run: |
          pacman -Syu --noconfirm --needed git meson ninja pkgconf rust sudo dbus
          useradd -m -s /bin/bash builder
          printf 'builder ALL=(ALL) NOPASSWD: ALL\n' > /etc/sudoers.d/oo8-builder
          chmod 0440 /etc/sudoers.d/oo8-builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
      - name: Pin package input to exactly this commit
        run: |
          sed -i "s|#branch=main|#commit=${GITHUB_SHA}|g" packaging/arch/PKGBUILD
          grep -F "#commit=${GITHUB_SHA}" packaging/arch/PKGBUILD
      - name: Build package as non-root user
        run: |
          su builder -s /bin/bash -c "cd '$GITHUB_WORKSPACE/packaging/arch' && makepkg --syncdeps --noconfirm --cleanbuild"
      - name: Inspect package file manifest
        run: |
          set -eu
          pkg="$(find packaging/arch -maxdepth 1 -type f -name 'oo8-*.pkg.tar.zst' -print -quit)"
          test -n "$pkg"
          pacman -Qp "$pkg"
          pacman -Qlp "$pkg" > /tmp/oo8-package-manifest.txt
          for path in usr/lib/oo7-daemon usr/lib/oo7-daemon-login usr/lib/oo7-portal usr/lib/security/pam_oo7.so usr/bin/oo7-cli usr/lib/systemd/user/oo7-daemon.service; do
            grep -Fq "$path" /tmp/oo8-package-manifest.txt
          done
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            expected="${GITHUB_REF_NAME#v}"
            [[ "$expected" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[[:alnum:]]+)*$ ]] || {
              echo "Release tag must look like v0.7.0.oo8.1" >&2
              exit 1
            }
            actual="$(pacman -Qp "$pkg" | awk '{print $2}')"
            test "$actual" = "${expected}-1" || {
              echo "Tag/package mismatch: expected ${expected}-1, got $actual" >&2
              exit 1
            }
          fi
      - name: Test packaged daemon with disposable keyrings (release only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          pkg="$(find packaging/arch -maxdepth 1 -type f -name 'oo8-*.pkg.tar.zst' -print -quit)"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          bsdtar -xf "$pkg" -C "$tmp" usr/lib/oo7-daemon
          OO8_STARTUP_ITERATIONS=12 bash tests/oo8-startup-race.sh unused "$tmp/usr/lib/oo7-daemon"
      - name: Compute package checksum
        run: |
          set -euo pipefail
          cd packaging/arch
          for pkg in oo8-*.pkg.tar.zst; do
            sha256sum "$pkg" > "$pkg.sha256"
          done
      - name: Create pacman repository database from tested package
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          cd packaging/arch
          pkg="$(find . -maxdepth 1 -type f -name 'oo8-*.pkg.tar.zst' -print -quit)"
          test -n "$pkg"
          repo-add oo8.db.tar.gz "$pkg"
          # repo-add creates .db/.files symlinks; GitHub Releases needs
          # regular files with these exact names for pacman's endpoints.
          for name in oo8.db oo8.files; do
            cp -L "$name" "$name.flat"
            mv -f "$name.flat" "$name"
            test -s "$name"
          done
          # Ensure database indexes the package that is actually attached.
          tar -xOf oo8.db desc 2>/dev/null || tar -tf oo8.db | head -n 20
      - name: Save staging package (never install automatically)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: oo8-arch-package-${{ github.sha }}
          path: |
            packaging/arch/oo8-*.pkg.tar.zst
            packaging/arch/oo8-*.pkg.tar.zst.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Attach package and pacman database to a draft GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          # Publishing as draft prevents the /latest/download repository
          # from pointing at an incompletely uploaded release.
          draft: true
          prerelease: false
          make_latest: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            packaging/arch/oo8-*.pkg.tar.zst
            packaging/arch/oo8-*.pkg.tar.zst.sha256
            packaging/arch/oo8.db
            packaging/arch/oo8.files
      - name: Publish validated Release and advance pacman's latest pointer
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = context.ref.replace('refs/tags/', '');
            const { data: release } = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner, repo, release_id: release.id, per_page: 100
            });
            const names = assets.map(a => a.name);
            const required = ['oo8.db', 'oo8.files'];
            for (const name of required) {
              if (!names.includes(name)) throw new Error('Missing release asset: ' + name);
            }
            if (!names.some(n => /^oo8-.*\\.pkg\\.tar\\.zst$/.test(n))) {
              throw new Error('No installable oo8 package attached to release');
            }
            await github.rest.repos.updateRelease({
              owner, repo, release_id: release.id,
              draft: false, prerelease: false, make_latest: 'true'
            });
